spring.application.name=vwa-edurecords

# ===== Database PostgreSQL (override bằng SPRING_DATASOURCE_* env var) =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vwa_edurecords?sslmode=disable&connectTimeout=5}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:332003}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

# ===== Flyway Migration =====
# spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history

# ===== JPA (ddl-auto=none - schema do Flyway quản lý) =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===== JWT (HS256) - Secret (min 32 ký tự cho 256 bits) =====
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:VwaEduRecords2026SecretKeyJwt256bitsMinLengthRequired}
app.security.jwt.access-token-ttl=${APP_SECURITY_JWT_ACCESS_TOKEN_TTL:PT1H}
app.security.jwt.refresh-token-ttl=${APP_SECURITY_JWT_REFRESH_TOKEN_TTL:P7D}
app.security.jwt.issuer=${APP_SECURITY_JWT_ISSUER:vwa-edurecords}

# ===== Server =====
server.port=${SERVER_PORT:8081}

# ===== Actuator (health check) =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.redis.enabled=true
management.health.db.enabled=true

# ===== Security: CORS =====
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ===== Security: Rate limit cho /login =====
app.security.ratelimit.login.max-attempts=${APP_SECURITY_RATELIMIT_LOGIN_MAX_ATTEMPTS:5}
app.security.ratelimit.login.window-seconds=${APP_SECURITY_RATELIMIT_LOGIN_WINDOW_SECONDS:60}

# ===== Security: Cookie =====
app.security.cookie.secure=${APP_SECURITY_COOKIE_SECURE:false}
app.security.cookie.samesite=${APP_SECURITY_COOKIE_SAMESITE:Lax}

# ===== Redis (lưu revoked JWT jti + rate limit) =====
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2000ms}

# ===== Logging =====
logging.level.vn.vwa.edurecords=INFO
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=DEBUG
