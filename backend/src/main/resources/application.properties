# =====================================================================
# Cấu hình dùng chung cho mọi môi trường.
# Giá trị nhạy cảm KHÔNG được đặt mặc định ở đây — phải lấy từ biến môi
# trường / secret manager. Thiếu biến thì ứng dụng không khởi động,
# đây là hành vi mong muốn (fail-fast) thay vì chạy với secret yếu.
# =====================================================================
spring.application.name=vwa-edurecords

# ===== Database =====
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ===== Flyway =====
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history

# ===== JPA =====
# Schema do Flyway quản lý — không để Hibernate tự tạo/sửa bảng.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# ===== JPA Batch (tối ưu import nhiều dòng) =====
# batch_size: gom INSERT theo lô để giảm round-trip.
# order_inserts/updates: sắp xếp theo FK để DB áp dụng batch hiệu quả.
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Tắt overhead không cần khi import lớn
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# ===== Multipart (Import Excel) =====
# Tối đa 10MB / file. Nếu lớn hơn → server trả 413 Payload Too Large.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2MB

# ===== JWT =====
# Bắt buộc cấu hình qua biến môi trường. Tối thiểu 32 ký tự cho HS256.
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET}
app.security.jwt.access-token-ttl=${APP_SECURITY_JWT_ACCESS_TOKEN_TTL:PT1H}
app.security.jwt.refresh-token-ttl=${APP_SECURITY_JWT_REFRESH_TOKEN_TTL:P7D}
app.security.jwt.issuer=${APP_SECURITY_JWT_ISSUER:vwa-edurecords}

# ===== Redis =====
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2000ms}

# ===== CORS =====
# Danh sách origin cách nhau bởi dấu phẩy, KHÔNG dùng "*".
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS}

# ===== Cookie =====
# secure=true bắt buộc khi chạy HTTPS để cookie refresh token không bị gửi
# qua kênh plaintext.
app.security.cookie.secure=${APP_SECURITY_COOKIE_SECURE:true}
app.security.cookie.samesite=${APP_SECURITY_COOKIE_SAMESITE:Lax}

# ===== Rate limit đăng nhập =====
app.security.ratelimit.login.max-attempts=${APP_SECURITY_RATELIMIT_LOGIN_MAX_ATTEMPTS:5}
app.security.ratelimit.login.window-seconds=${APP_SECURITY_RATELIMIT_LOGIN_WINDOW_SECONDS:60}

# ===== Admin khởi tạo =====
# Bỏ trống để không tạo tài khoản. Xem AdminBootstrap.
app.admin.username=${APP_ADMIN_USERNAME:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.ho-ten=${APP_ADMIN_HO_TEN:}
app.admin.email=${APP_ADMIN_EMAIL:}

# ===== Scheduled job đánh dấu quá hạn =====
app.phieu-muon.quahan.cron=${APP_PHIEU_MUON_QUAHAN_CRON:0 0 1 * * *}

# ===== Actuator =====
# Chỉ công khai health; các endpoint khác cần Spring Security đặt quyền riêng.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.redis.enabled=true
management.health.db.enabled=true

# ===== Server =====
server.port=${SERVER_PORT:8081}
# Tắt session persistence để không cần quyền Administrator trên Windows.
server.servlet.session.persistent=false

# ===== Forwarded headers =====
# Khi backend đứng sau reverse proxy (nginx/Caddy), Spring phải tin các header
# X-Forwarded-* để nhận đúng scheme/host/IP gốc của client. Nếu thiếu, các
# request qua proxy sẽ bị coi là đến từ 127.0.0.1 và scheme là http, làm sai
# redirect, log audit và kiểm tra IP.
# Bỏ trong local (không có proxy); BẮT BUỘC bật ở production sau reverse proxy.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}

# ===== Không rò chi tiết lỗi nội bộ ra response =====
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# ===== Logging =====
logging.level.vn.vwa.edurecords=INFO
logging.level.org.springframework.security=INFO
