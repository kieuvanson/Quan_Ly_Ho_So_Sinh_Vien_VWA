# =====================================================================
# Cấu hình cho môi trường phát triển — kích hoạt tự động khi chạy
# `mvnw spring-boot:run` (xem cấu hình profile trong pom.xml).
#
# CHỈ dùng khi chạy local. KHÔNG kích hoạt ở production.
# Toàn bộ giá trị ở đây là giá trị dev và KHÔNG có ý nghĩa bảo mật.
# =====================================================================

# ===== Database =====
# Mặc định khớp với PostgreSQL cài local. Đổi qua biến môi trường nếu khác.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vwa_edurecords?sslmode=disable}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:332003}

# ===== Redis =====
# Redis phục vụ refresh token + rate limit đăng nhập. Khởi động bằng:
#   docker compose up -d redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2000ms}

# ===== JWT =====
# Secret dev, KHÔNG dùng ở production.
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:VwaEduRecordsDevOnlySecretKeyDoNotUseInProd32}
app.security.cookie.secure=false

# ===== CORS =====
# Cho phép gọi API từ Vite dev server.
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ===== Admin khởi tạo =====
# Dev: tạo tài khoản quản trị khi bảng users còn trống.
# Ở production các biến này để trống trong application.properties.
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123456789}
app.admin.ho-ten=${APP_ADMIN_HO_TEN:Quản trị viên}
app.admin.email=${APP_ADMIN_EMAIL:admin@vwa.edu.vn}

# ===== DevTools =====
spring.devtools.restart.enabled=true

# ===== SQL log cho dễ debug =====
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ===== Actuator: xem chi tiết health khi debug =====
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info

# ===== Scheduled job: chạy mỗi phút để dễ kiểm tra cơ chế đánh dấu quá hạn =====
app.phieu-muon.quahan.cron=${APP_PHIEU_MUON_QUAHAN_CRON:0 * * * * *}
