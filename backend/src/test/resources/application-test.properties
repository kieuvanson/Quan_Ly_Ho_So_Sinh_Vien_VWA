# =====================================================================
# Cấu hình cho test. Giá trị chỉ dùng trong môi trường test, được load tự động
# nhờ @ActiveProfiles("test"). Không dùng ở local lẫn production.
# =====================================================================

# Biến bắt buộc — có giá trị riêng cho test, không dùng lại giá trị thật.
app.security.jwt.secret=test-only-secret-key-minimum-32-characters-long
app.security.cors.allowed-origins=http://localhost:5173

# Không cần admin khởi tạo trong test — tài khoản được tạo trực tiếp trong test.
app.admin.username=
app.admin.password=

# Tắt job đánh dấu quá hạn: chạy nền mỗi phút sẽ làm test khó đoán trạng thái.
# Test riêng của scheduled job sẽ bật lại khi cần.
app.phieu-muon.quahan.cron=0 0 0 29 2 ?

logging.level.vn.vwa.edurecords=WARN
logging.level.org.springframework=WARN
logging.level.org.testcontainers=INFO
