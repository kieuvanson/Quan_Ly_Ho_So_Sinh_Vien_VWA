# Docker Compose - Redis only
# Backend chạy local bằng mvnw spring-boot:run
# Frontend chạy local bằng npm run dev

services:
  # Redis for JWT token management
  redis:
    image: redis:7-alpine
    container_name: vwa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vwa_network

volumes:
  redis_data:
    driver: local

networks:
  vwa_network:
    driver: bridge
