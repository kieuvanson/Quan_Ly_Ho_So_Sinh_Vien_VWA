# =====================================================================
# Cấu hình PRODUCTION cho VWA EduRecords.
#
# Dùng song song với docker-compose.yml (file đó chỉ phục vụ dev):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# So với file dev, file này thêm các điểm quan trọng cho production:
#   - Postgres/Redis KHÔNG expose port ra Internet, chỉ nằm trong Docker network.
#   - Backend chỉ bind 127.0.0.1:8081; nginx là cổng vào duy nhất từ ngoài.
#   - Mọi service có `restart: unless-stopped` nên tự phục hồi khi VPS reboot.
#   - Healthcheck + `depends_on: service_healthy` để backend chỉ khởi động
#     sau khi Postgres và Redis thực sự sẵn sàng.
#
# Toàn bộ mật khẩu/secret lấy từ file .env cạnh file này. KHÔNG commit .env.
# =====================================================================

services:
  postgres:
    image: postgres:18-alpine
    container_name: vwa_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Thiếu POSTGRES_DB trong file .env}
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER trong file .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong file .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vwa_network

  redis:
    image: redis:7-alpine
    container_name: vwa_redis
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vwa_network

  backend:
    build:
      context: ./backend
      args:
        # Có thể hạ nếu VPS nhỏ. Mặc định 1g cho import Excel.
        JVM_XMS: ${JVM_XMS:-256m}
        JVM_XMX: ${JVM_XMX:-1g}
    container_name: vwa_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Tên service nội bộ, KHÔNG dùng localhost ở đây.
      SPRING_DATA_REDIS_HOST: redis
      # Bắt buộc khi đứng sau nginx để nhận đúng scheme/host/IP gốc.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    ports:
      # Chỉ localhost: nginx là cổng vào duy nhất từ Internet.
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vwa_network

  nginx:
    image: nginx:alpine
    container_name: vwa_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/vwa-edurecords.conf:/etc/nginx/conf.d/default.conf:ro
      # Webroot dùng chung với certbot khi xin chứng chỉ.
      - ./nginx/html:/var/www/html:ro
      - ./nginx/certbot:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - vwa_network

  # Gia hạn SSL tự động. Let's Encrypt chỉ cấp chứng chỉ 90 ngày nên
  # bắt buộc phải có bước gia hạn, nếu không site sẽ hết hạn.
  certbot:
    image: certbot/certbot
    container_name: vwa_certbot
    restart: unless-stopped
    volumes:
      - ./nginx/certbot:/etc/letsencrypt
      - ./nginx/html:/var/www/html
    # `|| exit 0` để container không ở trạng thái restarting khi
    # đến kỳ gia hạn mà chưa có gì cần gia hạn.
    entrypoint: >
      sh -c "certbot renew --quiet --webroot -w /var/www/html --non-interactive || exit 0"
    networks:
      - vwa_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  vwa_network:
    driver: bridge