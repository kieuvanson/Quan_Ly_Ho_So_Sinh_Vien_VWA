# =====================================================================
# Reverse proxy cho backend VWA EduRecords.
#
# Mục đích:
#   1. Kết nối frontend (Vercel) với backend (Docker) qua HTTPS.
#   2. Chặn request quá lớn ở tầng nginx, vì backend cho phép
#      upload Excel tối đa 10MB (spring.servlet.multipart.max-file-size).
#   3. Truyền đúng X-Forwarded-* để backend nhận scheme/host/IP gốc
#      (cần cho SERVER_FORWARD_HEADERS_STRATEGY).
#
# CÀI ĐẶT:
#   1. Sửa server_name + đường dẫn chứng chỉ SSL cho đúng domain thật.
#   2. Mount file này vào container:
#        - ./nginx/vwa-edurecords.conf:/etc/nginx/conf.d/default.conf:ro
#   3. Thư mục webroot phải được mount dùng chung với certbot để
#      xin chứng chỉ Let's Encrypt ở bước đầu.
# =====================================================================

# ---------------------------------------------------------------------
# Cổng 80: phục vụ ACME challenge + chuyển hết traffic sang HTTPS.
# Không redirect vội ở giai đoạn đầu, nếu không certbot không lấy được
# chứng chỉ (Let's Encrypt xác thực qua cổng 80).
# ---------------------------------------------------------------------
server {
    listen 80;
    server_name api.vwa.edu.vn;

    # Để certbot đặt file xác thực vào đây khi chạy `certbot certonly --webroot`.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------
# Cổng 443: toàn bộ API.
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.vwa.edu.vn;

    # ----- SSL -----
    # Đường dẫn tính bên trong container. Let's Encrypt lưu ở
    # /etc/letsencrypt/live/<domain>/ sau khi chạy certbot.
    # Sửa <domain> nếu domain của bạn khác.
    ssl_certificate     /etc/letsencrypt/live/api.vwa.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vwa.edu.vn/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ----- Giới hạn kích thước request -----
    # Mặc định của nginx chỉ cho 1MB, khiến import file Excel lớn
    # bị từ chối với lỗi 413 trước khi request tới được backend.
    # Đặt cao hơn giới hạn 10MB của backend để backend là nơi quyết định.
    client_max_body_size 20m;

    # ----- Header bảo mật -----
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # ----- Timeout -----
    # Import Excel parse + ghi hàng loạt có thể mất thời gian, nên
    # nới rộng so với mặc định 60s.
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # ----- Health check: không ghi access log để tránh nhiễu -----
    location /actuator/health {
        access_log off;
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
    }

    # ----- Proxy tới backend -----
    location / {
        # Tên service "backend" chỉ resolve được trong Docker network.
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Không cache API, tránh trả dữ liệu cũ cho nhân viên.
        proxy_buffering off;
    }
}